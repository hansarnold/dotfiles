[ids]
*

[main]
# Tap: Esc, hold: navigation layer.
capslock = overload(nav, esc)

[nav]
# Match the macOS nav positions; configure GNOME with ../gnome/nav-shortcuts.py.
space = backspace
h = C-A-left
l = C-A-right
# GNOME substitutes same-application window switching for App Expose.
j = C-M-j
k = macro2(0, 0, C-M-k)

# Window management and focus, adapted from Hyper + YUIOP on macOS.
y = M-left
# Requires GNOME switch-windows-backward bound to Ctrl+Super+u.
u = C-M-u
# Requires GNOME switch-windows bound to Ctrl+Super+i.
i = C-M-i
o = M-right
p = M-up

# Restore the size before tiling/maximizing, center, and accessibility zoom.
r = C-M-r
c = C-M-c
# Like Karabiner's repeat=false: holding D must not repeatedly toggle zoom.
d = macro2(0, 0, A-M-8)
