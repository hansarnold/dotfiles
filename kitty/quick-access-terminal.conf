# Quick Access Terminal Configuration
# This creates a Quake-style dropdown terminal

# Window dimensions
lines 30
columns 120

# Position on screen
edge center

# Transparency
background_opacity 0.92

# Auto-hide when focus is lost (set to no to manually control hiding)
hide_on_focus_loss no

# Keep this window persistent
remember_window_size no
start_as_hidden no

# Custom overrides for this window
# You can override any kitty setting here
# kitty_override font_size=14
