# macOS-specific Kitty settings.
shell zsh --login

# ============================================
# Ghostty macOS bindings (super == cmd)
# ============================================

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Line editing / cursor movement
map cmd+left      send_text all \x1bOH
map cmd+right     send_text all \x1bOF
map cmd+backspace send_text all \x15

# Tabs
map cmd+t      new_tab_with_cwd
map cmd+w      close_tab
map cmd+[      previous_tab
map cmd+]      next_tab
map cmd+0      set_tab_title

# Windows
map cmd+n new_os_window_with_cwd
map cmd+q quit

# Splits
map cmd+backslash      launch --location=vsplit --cwd=current
map cmd+ctrl+backslash launch --location=hsplit --cwd=current
map cmd+ctrl+h         neighboring_window left
map cmd+ctrl+l         neighboring_window right
map cmd+ctrl+k         neighboring_window up
map cmd+ctrl+j         neighboring_window down
map cmd+enter          toggle_layout stack
map cmd+ctrl+r         layout_action equalize

