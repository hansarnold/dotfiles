# Kitty Keybindings
#
# Mirrored from Ghostty:
#   ~/.config/dotfiles/ghostty/common
#   ~/.config/dotfiles/ghostty/platform/macos
#
# Ghostty clears all default bindings first (keybind = clear), so we do the
# same here and re-add only the Ghostty bindings.

clear_all_shortcuts yes

# ============================================
# Mouse
# ============================================

# Enable mouse scrolling
mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+shift+left press grabbed discard_event
mouse_map middle release ungrabbed paste_from_selection
mouse_map left press ungrabbed mouse_selection normal
mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line
mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point
mouse_map right press ungrabbed mouse_selection extend
mouse_map shift+middle release ungrabbed,grabbed paste_selection
mouse_map shift+middle press grabbed discard_event

# ============================================
# Ghostty common bindings
# ============================================

# Basic terminal operations
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Fullscreen
map f11 toggle_fullscreen

# Focus split: next / previous
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Scrolling
map page_up scroll_page_up
map page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# Config reload / inspector
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config

# ============================================
# Ghostty macOS bindings (super == cmd)
# ============================================

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Line editing / cursor movement
map cmd+left      send_text all \x1bOH
map cmd+right     send_text all \x1bOF
map cmd+backspace send_text all \x15

# Tabs
map cmd+t      new_tab_with_cwd
map cmd+w      close_tab
map cmd+[      previous_tab
map cmd+]      next_tab
map cmd+0      set_tab_title

# Windows
map cmd+n new_os_window_with_cwd
map cmd+q quit

# Splits
map cmd+backslash      launch --location=vsplit --cwd=current
map cmd+ctrl+backslash launch --location=hsplit --cwd=current
map cmd+ctrl+h         neighboring_window left
map cmd+ctrl+l         neighboring_window right
map cmd+ctrl+k         neighboring_window up
map cmd+ctrl+j         neighboring_window down
map cmd+enter          toggle_layout stack
map cmd+ctrl+r         layout_action equalize

# ============================================
# Kitty-only extras (no Ghostty equivalent)
# ============================================

# Ctrl+Shift+P opens the command palette in Ghostty, which kitty does not have.
# The old fzf scrollback search and hint bindings are intentionally left out
# so the keymap stays in sync with Ghostty.
