# ~/.config/kitty/kitty.conf

# Font, behavior and theme
include shared-settings.conf

# Keybindings (mirrored from Ghostty)
include keybindings.conf

# Original background image
background_opacity 0.9
background_image backgrounds/bg-blurred-darker.png
background_image_layout scaled
background_image_linear no
background_tint 0.0
background_tint_gaps 0.0

# Machine-local platform selector, generated by bootstrap.sh
include platform.local
